name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  check-for-release:
    name: Check for release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bump-type: ${{ steps.get-bump-type.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install git-cliff
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: git-cliff
      - name: Get bump type
        id: get-bump-type
        run: |
          context=$(git-cliff --verbose --unreleased --bump --context)
          bump_type=$(jq --raw-output '.[0].bump_type' <<< "$context")
          echo "value=$bump_type" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: check-for-release
    if: ${{ needs.check-for-release.outputs.bump-type != 'null' }}
    runs-on: windows-latest
    permissions:
      contents: write # to create GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Restore dependencies
        run: dotnet restore
      - name: Run git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          args: --verbose --unreleased --bump --github-repo ${{ github.repository }}
      - name: Publish
        env:
          version: ${{ steps.git-cliff.outputs.version }}
        run: |
          $version = $env:version.TrimStart("v")
          dotnet publish --verbosity normal --runtime win-x64 -p:Version=$version
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          changelog: ${{ steps.git-cliff.outputs.changelog }}
          version: ${{ steps.git-cliff.outputs.version }}
        run: |
          gh release create `
            --fail-on-no-commits `
            --notes-file $env:changelog `
            --title $env:version `
            $env:version `
            artifacts\publish\WindowsThemeSwitcher\release_win-x64\WindowsThemeSwitcher.exe
